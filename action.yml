name: Bash Explainer check
description: Check shell scripts, and the shell code in Dockerfiles, Makefiles and workflows, for constructs their shell lacks. Offline, no AI.
author: Shun Fujioka
branding:
  icon: terminal
  color: green

inputs:
  files:
    description: >-
      Files to check: bash globs separated by spaces or new lines (** matches any directories;
      node_modules and .git are skipped). Dockerfiles, Makefiles, YAML, package.json, Markdown and
      Python files are read for the shell code in them.
    default: '**/*.sh'
  shell:
    description: The shell the scripts are written for (sh, dash, bash…). Default, for each script, from its shebang or its name.
    default: ''
  bash-version:
    description: >-
      The bash release to check bash scripts for (5.2 or 5.3). Default, the tool's (5.2): `${ cmd; }`
      is then a warning. Needs a command-line tool with --bash-version, 0.9.0 or later (see `package`).
    default: ''
  fail-on-warning:
    description: Fail the step when there is a warning ('true' or 'false').
    default: 'true'
  strict:
    description: >-
      Also fail on a warning on a pitfall ('true' or 'false'), such as `x = 1` or `rm -rf $DIR/*`.
      The pitfalls are reported either way. Needs a command-line tool 0.9.0 or later (see `package`).
    default: 'false'
  sarif:
    description: Also write the problems to this SARIF file, for github/codeql-action/upload-sarif.
    default: ''
  package:
    description: The npm package to run. Default, bash-explainer at this action's version.
    default: ''

outputs:
  warnings:
    description: >-
      The number of warnings that fail the step (with fail-on-warning): the warnings on pitfalls
      count only with strict.
    value: ${{ steps.check.outputs.warnings }}
  pitfalls:
    description: The number of pitfalls found (warnings and notices).
    value: ${{ steps.check.outputs.pitfalls }}

runs:
  using: composite
  steps:
    - name: Check the scripts
      id: check
      shell: bash
      # Inputs reach the script as environment variables, never pasted into it.
      env:
        FILES: ${{ inputs.files }}
        CHECK_SHELL: ${{ inputs.shell }}
        CHECK_BASH_VERSION: ${{ inputs.bash-version }}
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        STRICT: ${{ inputs.strict }}
        SARIF: ${{ inputs.sarif }}
        PACKAGE: ${{ inputs.package }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # GitHub runs this with bash -e; the exit statuses below are handled by hand.
        set +e -uo pipefail
        shopt -s globstar nullglob
        package=${PACKAGE:-bash-explainer@$(node -p 'require(process.env.ACTION_PATH + "/cli/package.json").version')}

        # Expand each pattern as a glob, skipping dependencies and git internals.
        files=()
        read -r -d '' -a patterns <<< "$FILES" || true
        for pattern in "${patterns[@]}"; do
          for file in $pattern; do
            case "/$file/" in */node_modules/* | */.git/*) continue ;; esac
            [ -f "$file" ] && files+=("$file")
          done
        done
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No files match: $FILES"
          printf 'warnings=0\npitfalls=0\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        args=(--check)
        [ -n "$CHECK_SHELL" ] && args+=(--shell "$CHECK_SHELL")
        [ "$STRICT" = 'true' ] && args+=(--strict)
        check() { npx --yes --package="$package" bash-explainer "${args[@]}" "$@" -- "${files[@]}"; }

        # What the CLI can do, from its help: an older one (an earlier version, or a `package:` pin)
        # may lack --strict, --bash-version or --sarif.
        help=$(npx --yes --package="$package" bash-explainer --help 2>/dev/null)
        if [ "$STRICT" = 'true' ] && ! grep -q -- '--strict' <<< "$help"; then
          echo "::error title=Bash Explainer::strict needs a command-line tool with --strict (0.9.0 or later); $package has none."
          exit 2
        fi
        if [ -n "$CHECK_BASH_VERSION" ]; then
          if ! grep -q -- '--bash-version' <<< "$help"; then
            echo "::error title=Bash Explainer::bash-version needs a command-line tool with --bash-version; $package has none."
            exit 2
          fi
          args+=(--bash-version "$CHECK_BASH_VERSION")
        fi

        # A CLI with --sarif writes the annotations and the SARIF file in one run. An older one
        # takes a second run.
        if [ -n "$SARIF" ]; then
          if grep -q -- '--sarif <file>' <<< "$help"; then
            args+=(--sarif "$SARIF")
          else
            check --format sarif > "$SARIF"
            [ $? -le 1 ] || exit 2
          fi
        fi
        out=$(check --format github)
        status=$?
        # Printed, these lines become annotations on the pull request.
        [ -n "$out" ] && printf '%s\n' "$out"
        [ "$status" -le 1 ] || exit 2
        # The annotations of pitfalls have their own title; their warnings fail the step only with strict.
        pitfall=',title=Bash Explainer (pitfall)%3A '
        warnings=$(grep -c '^::warning ' <<< "$out")
        if [ "$STRICT" != 'true' ]; then warnings=$((warnings - $(grep -c "^::warning [^:]*$pitfall" <<< "$out"))); fi
        echo "warnings=$warnings" >> "$GITHUB_OUTPUT"
        echo "pitfalls=$(grep -c "^::[a-z]* [^:]*$pitfall" <<< "$out")" >> "$GITHUB_OUTPUT"
        echo "Checked ${#files[@]} file(s) with $package."
        if [ "$status" -eq 1 ] && [ "$FAIL_ON_WARNING" != 'true' ]; then status=0; fi
        exit "$status"
