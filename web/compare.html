<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Everything runs in this page: scripts are explained here and sent nowhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explains shell scripts line by line, like regex101 for bash. Runs in your browser; your script is sent nowhere.">
<!--robots-->
<title>Bash Explainer: compare</title>
<link rel="icon" href="icon.png">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="page.css">
</head>
<body data-page="compare">
<header class="top">
  <a class="brand" href="./"><img src="icon.png" alt="" width="28" height="28"><span>Bash Explainer</span></a>
  <p class="tagline" id="tagline"></p>
  <nav class="links"><a id="back" href="./"></a></nav>
</header>
<div class="toolbar">
  <label><span id="kind-label">File</span> <select id="kind"></select></label>
  <label><span id="lang-label">Language</span> <select id="lang"><option value="en">English</option><option value="ja">日本語</option></select></label>
  <label><span id="theme-label">Theme</span> <select id="theme"></select></label>
  <button id="settings-open" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span> <span id="settings-label">Settings</span></button>
  <button id="sample" type="button">Load the sample</button>
  <span id="status" role="status"></span>
</div>
<main class="compare">
  <section class="source">
    <h2 class="copy-head" id="editor-head"></h2>
    <div id="editor"></div>
    <section id="problems" hidden>
      <h2 id="problems-title">Problems</h2>
      <ul id="problem-list"></ul>
    </section>
  </section>
  <section class="copy" id="col-this">
    <h2 class="copy-head" id="head-this"></h2>
    <iframe id="frame-this" title="Explanation"></iframe>
    <p class="copy-note" id="note-this" hidden></p>
  </section>
  <section class="copy" id="col-other">
    <h2 class="copy-head" id="head-other"></h2>
    <iframe id="frame-other" title="Explanation"></iframe>
    <p class="copy-note" id="note-other" hidden></p>
  </section>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
<noscript><p class="noscript">Bash Explainer needs JavaScript to run in the browser.</p></noscript>
<script src="app.js"></script>
</body>
</html>
