<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Everything runs in this page: scripts are explained here and sent nowhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explains shell scripts line by line, like regex101 for bash. Runs in your browser; your script is sent nowhere.">
<!--robots-->
<title>Bash Explainer: compare</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="page.css">
</head>
<body data-page="compare">
<svg class="icons" aria-hidden="true">
  <symbol id="i-sample" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></symbol>
</svg>
<header class="top">
  <a class="brand" href="./" aria-label="Bash Explainer"><svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><g class="logo-accent"><path d="M10.6 3.7H3.7V21.6H14.2M21.4 3.7H28.3V21.6H19.2" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><path d="M6.2 22.7H13.6L5.6 29.2Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/></g><path class="logo-ink" d="M10 8.65L14 12.65L10 16.65M17.4 16.65H22.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">Bash Explainer</span></a>
  <div class="kind"><button id="kind" class="picker" type="button"><span class="picker-name"></span><span class="picker-short" aria-hidden="true"></span><svg class="chev" aria-hidden="true" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg></button><ul id="kind-list" class="picker-list"></ul></div>
  <p class="tagline" id="tagline"></p>
  <div class="actions">
    <label class="compact"><span id="lang-label" class="sr-only">Language</span><select id="lang"><option value="en">English</option><option value="ja">日本語</option></select></label>
    <label class="compact"><span id="theme-label" class="sr-only">Theme</span><select id="theme"></select></label>
    <button id="sample" class="icon-btn" type="button"><svg aria-hidden="true"><use href="#i-sample"/></svg></button>
    <button id="settings-open" class="icon-btn" type="button" aria-haspopup="dialog"><svg class="ico" data-icon="gear" viewBox="0 0 16 16" aria-hidden="true"></svg><span id="settings-label" class="sr-only">Settings</span></button>
    <a id="back" class="install" href="./"></a>
  </div>
</header>
<main class="compare">
  <section class="source">
    <h2 class="copy-head" id="editor-head"></h2>
    <div id="editor"></div>
    <section id="problems" hidden>
      <h2><span id="problems-title">Problems</span> <span id="problems-count" class="count"></span></h2>
      <ul id="problem-list"></ul>
    </section>
  </section>
  <section class="copy" id="col-this">
    <h2 class="copy-head" id="head-this"></h2>
    <iframe id="frame-this" title="Explanation"></iframe>
    <p class="copy-note" id="note-this" hidden></p>
  </section>
  <section class="copy" id="col-other">
    <h2 class="copy-head" id="head-other"></h2>
    <iframe id="frame-other" title="Explanation"></iframe>
    <p class="copy-note" id="note-other" hidden></p>
  </section>
</main>
<p id="status" role="status"></p>
<dialog id="settings-dialog" class="sheet" aria-labelledby="settings-title"></dialog>
<noscript><p class="noscript">Bash Explainer needs JavaScript to run in the browser.</p></noscript>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
