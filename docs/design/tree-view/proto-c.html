  color-scheme: light dark;

  --rule: var(--vscode-panel-border, #d0d7de);

  --ui: var(--vscode-font-family, system-ui, -apple-system, "Segoe UI", sans-serif);
  /* One colour per reader: the parent bash, the child bash in $( ), the command, an embedded language. */

  --l-child: #0a62c9;
  --l-cmd: #1a7f37;
  --l-lang: #b04f00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--vscode-editor-background, #1e1e1e);
    --fg: var(--vscode-foreground, #d4d4d4);
    --muted: var(--vscode-descriptionForeground, #9da5b0);
    --rule: var(--vscode-panel-border, #3c3c3c);
    --focus: var(--vscode-focusBorder, #4daafc);
    --l-bash: #c796ee;
    --l-child: #6badff;
    --l-cmd: #7fcf7f;
    --l-lang: #f0a050;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --fg: #d4d4d4; --muted: #9da5b0; --rule: #3c3c3c; --focus: #4daafc;
  --l-bash: #c796ee; --l-child: #6badff; --l-cmd: #7fcf7f; --l-lang: #f0a050;
}
@media (forced-colors: active) {
  :root { --l-bash: CanvasText; --l-child: LinkText; --l-cmd: CanvasText; --l-lang: LinkText; --rule: CanvasText; --focus: Highlight; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--ui); padding: 16px; }
h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.examples button, .ctl button {

  border-radius: 4px; padding: 3px 8px; cursor: pointer;
}
.examples button[aria-pressed="true"] { border-color: var(--focus); background: color-mix(in srgb, var(--focus) 14%, var(--bg)); }

.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.l-bash { --c: var(--l-bash); } .l-child { --c: var(--l-child); } .l-cmd { --c: var(--l-cmd); } .l-lang { --c: var(--l-lang); }

.detail .who { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); font-weight: 600; }
.detail code { font-family: var(--code); }

svg { display: block; width: 100%; overflow: visible; }
.node { cursor: pointer; outline: none; }
.node .chip { fill: color-mix(in srgb, var(--c) 10%, var(--bg)); stroke: var(--c); stroke-width: 1.3; }
.node .kind { font: 600 11px var(--ui); fill: var(--c); }
.node .code { font: 13px var(--code); fill: var(--fg); }
.node .note { font: 12px var(--ui); fill: var(--muted); }
.node .tw { fill: var(--c); }

}
</style>
