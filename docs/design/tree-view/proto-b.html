<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Unfolding</title>
<style>
/* Shared theme tokens. In the VS Code webview the --vscode-* variables exist and win; on the web page the fallbacks apply. */
:root {
  color-scheme: light dark;
  --bg: var(--vscode-editor-background, #ffffff);
  --fg: var(--vscode-foreground, #1f2328);
  --muted: var(--vscode-descriptionForeground, #5c6670);
  --rule: var(--vscode-panel-border, #d0d7de);
  --focus: var(--vscode-focusBorder, #0969da);
  --code: var(--vscode-editor-font-family, ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace);
  --ui: var(--vscode-font-family, system-ui, -apple-system, "Segoe UI", sans-serif);
  /* One colour per reader: the parent bash, the child bash in $( ), the command, an embedded language. */
  --l-bash: #7a3db8;
  --l-child: #0a62c9;
  --l-cmd: #1a7f37;
  --l-lang: #b04f00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--vscode-editor-background, #1e1e1e);
    --fg: var(--vscode-foreground, #d4d4d4);
    --muted: var(--vscode-descriptionForeground, #9da5b0);
    --rule: var(--vscode-panel-border, #3c3c3c);
    --focus: var(--vscode-focusBorder, #4daafc);
    --l-bash: #c796ee;
    --l-child: #6badff;
    --l-cmd: #7fcf7f;
    --l-lang: #f0a050;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --fg: #d4d4d4; --muted: #9da5b0; --rule: #3c3c3c; --focus: #4daafc;
  --l-bash: #c796ee; --l-child: #6badff; --l-cmd: #7fcf7f; --l-lang: #f0a050;
}
@media (forced-colors: active) {
  :root { --l-bash: CanvasText; --l-child: LinkText; --l-cmd: CanvasText; --l-lang: LinkText; --rule: CanvasText; --focus: Highlight; }

* { box-sizing: border-box; }
html, body { margin: 0; }

.examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.examples button, .ctl button {

.detail .who { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); font-weight: 600; }
.detail code { font-family: var(--code); }

.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.ctl button { min-width: 34px; font-size: 13px; }
.ctl .dots { display: flex; gap: 4px; margin-left: 4px; }
.ctl .dots button { min-width: 0; width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 11px; }
.ctl .dots button[aria-current="step"] { background: var(--focus); color: var(--bg); border-color: var(--focus); }
.caption { font-size: 14px; min-height: 2.9em; margin: 0 0 12px; }
.caption b { color: var(--c, var(--fg)); }

@media (max-width: 480px) { #stage { font-size: 15px; } }

  border-radius: 6px; max-width: 100%; vertical-align: middle; }
.v.gap { column-gap: 1ch; }
.v.open { padding: 3px 5px; }
.v.open.gap { column-gap: 8px; row-gap: 6px; }
.v > .lab { display: none; font: 600 10px/1.3 var(--ui); white-space: nowrap; }
.v.open > .lab { display: block; flex-basis: 100%; visibility: hidden; margin-bottom: 1px; }
#stage { position: relative; }
#frames { position: absolute; inset: 0; pointer-events: none; }
#content { position: relative; }
.frame { position: absolute; border: 1.5px solid var(--c); border-radius: 6px; background: color-mix(in srgb, var(--c) 5%, transparent); }
.frame.word, .frame.op, .frame.assignment, .frame.quote, .frame.param, .frame.name { background: color-mix(in srgb, var(--c) 13%, transparent); }

.frame > span { position: absolute; top: 2px; left: 5px; font: 600 10px/1.3 var(--ui); color: var(--c); white-space: nowrap; }
.v.word.open, .v.op.open { padding: 1px 5px; }
.v.op.open { color: var(--c); font-weight: 700; }

.hidden { display: none !important; }

.reading { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }

.chip > .v { margin-top: 4px; }
[tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.on-hover { box-shadow: 0 0 0 2px var(--c); }
.v.open.box-bash, .chip.l-bash { --c: var(--l-bash); }
</style>

    if (!group) mk('span', 'code', e).textContent = line.slice(n.s, n.e);
    const role = n.kind === 'argument' && n.note ? n.note.split(/ \(| —|:|;|\./)[0].replace(/`/g, '') : null;
    mk('span', 'tag', e).textContent = n.kind === 'command' ? `runs ${n.label}` : role && role.length < 24 ? role : labelsOf(n)[0];
    if (group) {
      const inner = mk('div', 'reading', e);
      n.children.forEach((c) => chip(c, [...anc, n], inner));
    } else n.children.forEach((c) => chip(c, [...anc, n], e));
  }
  const stage = document.getElementById('content');
  stage.replaceChildren();
  document.getElementById('frames').replaceChildren();
  frames.clear();
  shell(d.root, [], stage);
  stage.querySelectorAll('[tabindex]').forEach((e) => {
    e.addEventListener('mouseover', (ev) => { ev.stopPropagation(); show(e); });
    e.addEventListener('focus', (ev) => { ev.stopPropagation(); show(e); });
  });
}
function show(e) {
  const det = document.getElementById('detail');
  document.querySelectorAll('.on-hover').forEach((x) => x.classList.remove('on-hover'));
  const it = info.get(e);
  if (!it) return;
  e.classList.add('on-hover');
  const n = it.n;
  det.style.setProperty('--c', `var(--l-${n.layer})`);
  det.innerHTML = `<div class="who">${esc(readerOf(n, it.anc))}</div><b>${esc(labelsOf(n)[0])}</b> <code>${esc(DATA[cur].line.slice(n.s, n.e))}</code><br>${esc(n.note || '')}`;
}
function apply(s) {
  document.querySelectorAll('#stage [data-open]').forEach((e) => e.classList.toggle('open', s >= +e.dataset.open));
  document.querySelectorAll('#stage [data-show]').forEach((e) => e.classList.toggle('hidden', s < +e.dataset.show));
  // Hidden parts are not focusable.
  document.querySelectorAll('#stage [tabindex]').forEach((e) => { e.tabIndex = e.closest('.hidden') ? -1 : 0; });
}
// FLIP: measure every text piece and chip, change the step, then animate each from where it was.
function go(s, animate = !REDUCED) {
  s = Math.max(0, Math.min(STEPS.length - 1, s));
  const stage = document.getElementById('content');
  const movers = [...stage.querySelectorAll('.t, .chip, .v')];
  const before = new Map(movers.map((e) => [e, e.getBoundingClientRect()]));
  const was = new Map(movers.map((e) => [e, !e.closest('.hidden')]));
  document.getElementById('stage').getAnimations({ subtree: true }).forEach((a) => a.finish());
  step = s;
  apply(s);
  const cap = document.getElementById('cap');
  cap.innerHTML = `<span style="color:var(--muted)">${s + 1}/${STEPS.length}</span> ${STEPS[s][0]}`;
  cap.style.setProperty('--c', STEPS[s][1] ? `var(--l-${STEPS[s][1]})` : 'var(--fg)');
  document.querySelectorAll('#dots button').forEach((b, i) => b.toggleAttribute('aria-current', false) || (i === s && b.setAttribute('aria-current', 'step')));
  layoutFrames(animate, before);
  if (!animate) return;
  let i = 0;
  for (const e of movers) {
    if (e.closest('.hidden')) continue;
    const a = before.get(e), b = e.getBoundingClientRect();
    const isBox = e.classList.contains('v');
    if (was.get(e)) {
      if (isBox) {
        // Boxes: their frame fades in or out; the text inside does the moving.
        continue;
      }
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < .5 && Math.abs(dy) < .5) continue;
      e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
        { duration: 650, delay: Math.min(i++ * 22, 350), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    } else if (isBox || (e.parentElement.closest('.chip') && !was.get(e.parentElement.closest('.chip')))) {
      e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 100, fill: 'backwards' });
    } else {
      // New chip: it unfolds from the word it reads (the innermost word holding the same characters).
      const src = [...stage.querySelectorAll('.v.word, .v.assignment, .v.quote, .v.param')]
        .filter((w) => !w.closest('.hidden') && +w.dataset.s <= +e.dataset.s && +w.dataset.e >= +e.dataset.e)
        .sort((x, y) => (x.dataset.e - x.dataset.s) - (y.dataset.e - y.dataset.s))[0];
      const from = src ? src.getBoundingClientRect() : b;
      const sx = Math.min(1, from.width / Math.max(b.width, 1)), sy = Math.min(1, from.height / Math.max(b.height, 1));
      e.animate([
        { transform: `translate(${from.left - b.left}px, ${from.top - b.top}px) scale(${sx}, ${sy})`, transformOrigin: '0 0', opacity: .2 },
        { transform: 'none', transformOrigin: '0 0', opacity: 1 },
      ], { duration: 750, delay: 150 + Math.min(i++ * 70, 700), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
  }
}
function layoutFrames(animate, before) {
  const layer = document.getElementById('frames');
  const base = document.getElementById('stage').getBoundingClientRect();
  const rel = (r) => ({ left: `${r.left - base.left}px`, top: `${r.top - base.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  const open = new Set([...document.querySelectorAll('#content .v.open')].filter((e) => !e.closest('.hidden')));
  for (const [e, f] of frames) {
    if (open.has(e)) continue;
    frames.delete(e);
    if (animate) f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).finished.then(() => f.remove()); else f.remove();
  }
  for (const e of open) {
    const r = e.getBoundingClientRect(), to = rel(r);
    let f = frames.get(e), from;
    if (!f) {
      f = mk('div', 'frame ' + [...e.classList].filter((c) => c !== 'v' && c !== 'open').join(' '), layer);
      const lab = e.querySelector(':scope > .lab');
      if (lab) mk('span', '', f).textContent = lab.textContent;
      frames.set(e, f);
      const b = before && before.get(e);
      from = b && b.width ? { ...rel(b), opacity: 0 } : { ...to, opacity: 0 };
    } else from = { left: f.style.left, top: f.style.top, width: f.style.width, height: f.style.height, opacity: 1 };
    Object.assign(f.style, to);
    if (animate) f.animate([from, { ...to, opacity: 1 }], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}
function play() {
  const btn = document.getElementById('play');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶ Play'; btn.setAttribute('aria-label', 'Play'); return; }
  if (step >= STEPS.length - 1) go(0, false);
  btn.textContent = '❚❚ Pause'; btn.setAttribute('aria-label', 'Pause');
  timer = setInterval(() => { if (step >= STEPS.length - 1) return play(); go(step + 1); }, 2400);
  setTimeout(() => go(step + 1), 300);
}
const dots = document.getElementById('dots');
STEPS.forEach((_, i) => { const b = mk('button', '', dots); b.textContent = i + 1; b.setAttribute('aria-label', `Step ${i + 1}`); b.onclick = () => go(i); });
document.getElementById('prev').onclick = () => go(step - 1);
document.getElementById('next').onclick = () => go(step + 1);
document.getElementById('play').onclick = play;
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.examples, .ctl')) return;
  if (e.key === 'PageDown' || e.key === '.') go(step + 1);
  if (e.key === 'PageUp' || e.key === ',') go(step - 1);
});
exampleButtons(document.getElementById('ex'), (i) => { cur = i; build(DATA[i]); go(step, false); });
cur = Number(params.get('ex') || 0);
document.querySelectorAll('#ex button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === cur)));
build(DATA[cur]);
go(Number(params.get('step') ?? (REDUCED ? STEPS.length - 1 : 0)), false);
window.__go = go;
addEventListener('resize', () => layoutFrames(false));
</script>
