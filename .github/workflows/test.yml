name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Extensions run on the Node.js built into VS Code (Electron), so test both ends of the
        # range we support: VS Code 1.85 (engines.vscode) has Node.js 18.15, current VS Code 24.21.
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The tests compare the built-in runners with the real tools, and the
      # shell-support table with real shells; tools that are missing are skipped.
      - name: Install the tools the tests compare against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk jq dash busybox mksh yash ksh93u+m zsh

      - run: npm ci

      # The web page test drives Chromium; playwright needs Node.js 20 or later.
      - name: Install Chromium for the web page test
        if: matrix.node == 24
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Type check and unit tests
        run: npm test
        env:
          # Fail instead of skipping when the browser cannot start.
          BASH_EXPLAINER_BROWSER: ${{ matrix.node == 24 && '1' || '' }}

      - name: Package the extension
        run: npm run package

  integration:
    # The production build in a real VS Code: the oldest version it supports and the newest. On
    # Linux the whole VS Code runs in a network namespace of its own, with no network at all.
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, vscode: 1.85.0 }
          - { os: ubuntu-24.04, vscode: stable }
          - { os: windows-2025, vscode: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download VS Code
        id: vscode
        shell: bash
        run: echo "path=$(node --import tsx integration/run.ts --version=${{ matrix.vscode }} --download-only | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Run the tests in VS Code, with no network
        if: runner.os == 'Linux'
        env:
          BASH_EXPLAINER_NO_NETWORK: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          # Ubuntu 24.04 keeps unprivileged users out of new namespaces unless told otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn xvfb-run -a node --import tsx integration/run.ts --executable="${{ steps.vscode.outputs.path }}"

      - name: Run the tests in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node --import tsx integration/run.ts --executable="${{ steps.vscode.outputs.path }}"
