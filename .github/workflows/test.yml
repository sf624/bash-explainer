name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Extensions run on the Node.js built into VS Code (Electron), so test both ends of the
        # range we support: VS Code 1.85 (engines.vscode) has Node.js 18.15, current VS Code 24.21.
        node: [18, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The tests compare the built-in runners with the real tools, and the
      # shell-support table with real shells; tools that are missing are skipped.
      - name: Install the tools the tests compare against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk jq dash busybox mksh yash ksh93u+m zsh

      - run: npm ci

      - name: Type check and unit tests
        run: npm test

      - name: Package the extension
        run: npm run package
