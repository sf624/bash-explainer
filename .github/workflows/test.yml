name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Extensions run on the Node.js built into VS Code (Electron), so test both ends of the
        # range we support: VS Code 1.85 (engines.vscode) has Node.js 18.15, current VS Code 24.21.
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Find the playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"; echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      # apt downloads from the runner's mirror sometimes stall for minutes, or crawl at a few dozen kB/s: give apt
      # timeouts and retries (also for the apt-get that `--with-deps` runs itself), keep the downloaded .deb files, and
      # cache them (in a directory of the runner's; apt gets copies) so that a later run needs no download.
      - name: Configure apt
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-retries
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p "$HOME/apt-debs"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache
        with:
          path: ~/apt-debs
          key: apt-${{ runner.os }}-${{ steps.playwright.outputs.image }}-node${{ matrix.node }}-pw${{ steps.playwright.outputs.version }}-${{ hashFiles('.github/actions/install-tools/action.yml') }}

      - name: Use the cached .deb files
        if: steps.apt-cache.outputs.cache-hit == 'true'
        run: |
          ls "$HOME/apt-debs" | wc -l
          sudo cp -n "$HOME"/apt-debs/*.deb /var/cache/apt/archives/

      - uses: ./.github/actions/install-tools

      # test/fixtures/snippets.json (the inputs of the syntax tests and the fuzz) must hold the snippets of the tests as they are now.
      - name: Check the snippets of the tests
        if: matrix.node == 24
        run: npx tsx scripts/extract-snippets.ts --check

      # The web page test drives Chromium; playwright needs Node.js 20 or later. The browser is cached by
      # the playwright version (`install` then finds it and downloads nothing); the system libraries
      # (`--with-deps`) are installed every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.node == 24
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for the web page test
        if: matrix.node == 24
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Keep the downloaded .deb files for the cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: cp -n /var/cache/apt/archives/*.deb "$HOME/apt-debs/"

      - name: Type check and unit tests
        if: matrix.node != 24
        run: npm test
        env:
          # Fail instead of skipping when PyYAML is missing (test/host-shells.test.ts).
          BASH_EXPLAINER_PYYAML: '1'

      # On the newest Node.js, with every tool installed, the unit tests also measure coverage.
      - name: Type check, and unit tests with coverage
        if: matrix.node == 24
        # The two type checks run beside the tests (not before them) and are waited for after: a failure of
        # either, or of the tests, fails the step. The tests run in parallel (.mocharc.cjs: three workers on
        # the four cores of the runner), so the type checks mostly take the fourth core.
        run: |
          npx tsc --noEmit > "$RUNNER_TEMP/tsc-src.log" 2>&1 &
          src=$!
          npx tsc --noEmit -p web > "$RUNNER_TEMP/tsc-web.log" 2>&1 &
          web=$!
          status=0
          npm run coverage || status=1
          for check in src web; do
            pid=${!check}
            if wait "$pid"; then
              echo "tsc ($check): ok"
            else
              echo "::error::tsc ($check) failed"
              cat "$RUNNER_TEMP/tsc-$check.log"
              status=1
            fi
          done
          exit "$status"
        env:
          # Fail instead of skipping when the browser cannot start, or PyYAML is missing.
          BASH_EXPLAINER_BROWSER: '1'
          BASH_EXPLAINER_PYYAML: '1'

      - name: Coverage summary
        if: matrix.node == 24
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24
        with:
          name: coverage
          path: coverage/

      # Every file runs all its lines and takes all its branches, but those in coverage-floors.json,
      # which must not go below their floors.
      - name: Check coverage
        if: matrix.node == 24
        run: npm run coverage:check

      - name: Package the extension
        run: npm run package

  integration:
    # The production build in a real VS Code: the oldest version it supports and the newest. On
    # Linux the whole VS Code runs in a network namespace of its own, with no network at all.
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, vscode: 1.85.0 }
          - { os: ubuntu-24.04, vscode: stable }
          - { os: windows-2025, vscode: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Download VS Code
        id: vscode
        shell: bash
        # The update server sometimes fails to answer: try again, and stop here if it never does
        # (the tests themselves run with no network and could not download it).
        run: |
          for attempt in 1 2 3; do
            if path=$(node --import tsx integration/run.ts --version=${{ matrix.vscode }} --download-only | tail -n 1) && [ -e "$path" ]; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Download failed (attempt $attempt)"
            sleep 15
          done
          echo "::error::Could not download VS Code ${{ matrix.vscode }}"
          exit 1

      - name: Run the tests in VS Code, with no network
        if: runner.os == 'Linux'
        env:
          BASH_EXPLAINER_NO_NETWORK: '1'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb
          # Ubuntu 24.04 keeps unprivileged users out of new namespaces unless told otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn xvfb-run -a node --import tsx integration/run.ts --executable="${{ steps.vscode.outputs.path }}"

      - name: Run the tests in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node --import tsx integration/run.ts --executable="${{ steps.vscode.outputs.path }}"

  integration-web:
    # The web bundle in VS Code for the Web (as on vscode.dev and github.dev), in Chromium.
    name: VS Code for the Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # apt downloads from the runner's mirror sometimes stall for minutes: give apt timeouts and retries, also
      # for the apt-get that `--with-deps` runs itself.
      - name: Make apt retry and time out
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-retries

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tests in VS Code for the Web
        run: npm run test:integration:web

  action:
    # The GitHub Action (action.yml), on this repository's fixtures, with the command-line tool
    # packed from this commit instead of the published one.
    name: GitHub Action
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Pack the command-line tool
        id: pack
        run: |
          npm run build:cli
          echo "tgz=$RUNNER_TEMP/$(npm pack ./cli --pack-destination "$RUNNER_TEMP" --silent)" >> "$GITHUB_OUTPUT"

      - name: A POSIX sh script with bashisms fails the check
        id: failing
        continue-on-error: true
        uses: ./
        with:
          files: test/fixtures/posix.sh
          sarif: ${{ runner.temp }}/results.sarif
          package: ${{ steps.pack.outputs.tgz }}

      - name: The same script, without failing the step
        id: lenient
        uses: ./
        with:
          files: test/fixtures/posix.sh
          fail-on-warning: 'false'
          package: ${{ steps.pack.outputs.tgz }}

      - name: Check that it failed, annotated, and wrote SARIF
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          WARNINGS: ${{ steps.failing.outputs.warnings }}
          LENIENT: ${{ steps.lenient.outputs.warnings }}
          SARIF: ${{ runner.temp }}/results.sarif
        run: |
          test "$OUTCOME" = failure
          # The annotations are printed after the SARIF, so they must be there too.
          test "$WARNINGS" -gt 0
          test "$LENIENT" = "$WARNINGS"
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.env.SARIF, "utf8")); if (!s.runs[0].results.some((r) => r.ruleId === "dbracket")) process.exit(1)'

      # A pitfall's warning fails the step only with strict; `warnings` counts what fails it, `pitfalls` every pitfall.
      - name: Write a bash script with a pitfall
        run: printf '#!/bin/bash\nx = 1\nread line\n' > "$RUNNER_TEMP/pitfall.sh"

      - name: A pitfall's warning fails the step with strict
        id: strict
        continue-on-error: true
        uses: ./
        with:
          files: ${{ runner.temp }}/pitfall.sh
          strict: 'true'
          package: ${{ steps.pack.outputs.tgz }}

      - name: The same script passes without strict
        id: not-strict
        uses: ./
        with:
          files: ${{ runner.temp }}/pitfall.sh
          package: ${{ steps.pack.outputs.tgz }}

      - name: Check that only strict failed, and the counts
        env:
          OUTCOME: ${{ steps.strict.outcome }}
          WARNINGS: ${{ steps.strict.outputs.warnings }}
          PITFALLS: ${{ steps.strict.outputs.pitfalls }}
          LENIENT_WARNINGS: ${{ steps.not-strict.outputs.warnings }}
          LENIENT_PITFALLS: ${{ steps.not-strict.outputs.pitfalls }}
        run: |
          test "$OUTCOME" = failure
          test "$WARNINGS" = 1
          test "$PITFALLS" = 2
          test "$LENIENT_WARNINGS" = 0
          test "$LENIENT_PITFALLS" = 2

      # bash 5.3's `${ cmd; }` is a warning for bash 5.2 (the default), and none with bash-version 5.3.
      - name: Write a bash script with `${ cmd; }`
        run: printf '#!/bin/bash\nx=${ echo a; }\necho "$x"\n' > "$RUNNER_TEMP/funsub.sh"

      - name: It fails the step for bash 5.2
        id: bash52
        continue-on-error: true
        uses: ./
        with:
          files: ${{ runner.temp }}/funsub.sh
          package: ${{ steps.pack.outputs.tgz }}

      - name: It passes with bash-version 5.3
        id: bash53
        uses: ./
        with:
          files: ${{ runner.temp }}/funsub.sh
          bash-version: '5.3'
          package: ${{ steps.pack.outputs.tgz }}

      - name: Check that only bash 5.2 failed
        env:
          OUTCOME: ${{ steps.bash52.outcome }}
          WARNINGS: ${{ steps.bash52.outputs.warnings }}
          WARNINGS53: ${{ steps.bash53.outputs.warnings }}
        run: |
          test "$OUTCOME" = failure
          test "$WARNINGS" = 1
          test "$WARNINGS53" = 0

      # A CLI without --sarif (0.7.0, or a package: pin of an older version) takes a second run.
      # Packed from npm in another directory: npx in this repository would take the extension's own
      # package.json (also named bash-explainer) for the tool.
      - name: Download the published 0.7.0
        id: older-pack
        working-directory: ${{ runner.temp }}
        run: echo "tgz=$RUNNER_TEMP/$(npm pack bash-explainer@0.7.0 --silent)" >> "$GITHUB_OUTPUT"

      - name: An older command-line tool, pinned, still writes SARIF
        id: older
        continue-on-error: true
        uses: ./
        with:
          files: test/fixtures/posix.sh
          sarif: ${{ runner.temp }}/older.sarif
          package: ${{ steps.older-pack.outputs.tgz }}

      - name: Check the older tool's result
        env:
          OUTCOME: ${{ steps.older.outcome }}
          WARNINGS: ${{ steps.older.outputs.warnings }}
          SARIF: ${{ runner.temp }}/older.sarif
        run: |
          test "$OUTCOME" = failure
          test "$WARNINGS" -gt 0
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.env.SARIF, "utf8")); if (!s.runs[0].results.some((r) => r.ruleId === "dbracket")) process.exit(1)'

      - name: strict with a pinned tool that has no --strict fails
        id: older-strict
        continue-on-error: true
        uses: ./
        with:
          files: ${{ runner.temp }}/pitfall.sh
          strict: 'true'
          package: ${{ steps.older-pack.outputs.tgz }}

      - name: Check that it failed
        env:
          OUTCOME: ${{ steps.older-strict.outcome }}
        run: test "$OUTCOME" = failure

      - name: Scripts without problems pass
        uses: ./
        with:
          files: test/fixtures/sample.sh images/readme/*.sh
          package: ${{ steps.pack.outputs.tgz }}

  bash-ast:
    # Compares our syntax tree with bash's own parser through bash-ast (test/bash-ast.test.ts), and the commands
    # the tokens of the explanations lie in (test/command-tokens.test.ts).
    # GPL boundary: bash-ast is GPL-3.0. We only download and run it as a separate program, and read
    # its JSON on a pipe. We never redistribute it: no artifact, cache, commit, release or bundle.
    name: Syntax tree against bash-ast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASH_AST_VERSION: v0.3.3
      BASH_AST_SHA256: e38481887369559f493bbbceb43214fd7a5bc7238f0bc8fdf2d6cd4699d6925f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download bash-ast from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="bash-ast-$BASH_AST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$BASH_AST_VERSION" --repo cv/bash-ast --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "$BASH_AST_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          mkdir "$RUNNER_TEMP/bash-ast"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bash-ast"
          echo "BASH_AST=$RUNNER_TEMP/bash-ast/bash-ast" >> "$GITHUB_ENV"

      # --no-config: .mocharc.cjs lists every test file, and --spec would add to it.
      - name: Run test/bash-ast.test.ts
        env:
          # Fail instead of skipping when bash-ast cannot be run.
          BASH_EXPLAINER_BASH_AST: '1'
        run: npx mocha --no-config --node-option import=tsx --timeout 10000 test/bash-ast.test.ts

      # Each token of an explanation lies in one command of ours, and bash-ast has that command (docs/design/syntax-tree.md).
      - name: Run test/command-tokens.test.ts
        # (Also when the shape test fails: the two report different things.)
        if: success() || failure()
        env:
          BASH_EXPLAINER_BASH_AST: '1'
        run: npx mocha --no-config --node-option import=tsx --timeout 10000 test/command-tokens.test.ts

  bash53:
    # What we say of bash 5.3's constructs, against a real bash 5.3 and the bash 5.2 of the runner (test/bash53.test.ts,
    # docs/design/bash-versions.md). GPL boundary: bash is GPL-3.0. We build it from the release tarball and only run
    # it as a separate program. We never redistribute it: no artifact, cache, commit, release or bundle.
    name: bash 5.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASH53_SHA256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build bash 5.3 from the release tarball
        run: |
          src="$RUNNER_TEMP/bash-5.3-src"
          mkdir "$src"
          # From the GNU mirror redirector, then two fixed mirrors: each download is checked before it is used.
          for url in https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz https://mirrors.kernel.org/gnu/bash/bash-5.3.tar.gz https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz; do
            rm -f "$src/bash-5.3.tar.gz"
            if curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "$src/bash-5.3.tar.gz" "$url" \
              && echo "$BASH53_SHA256  $src/bash-5.3.tar.gz" | sha256sum --check --quiet; then
              ok=1
              break
            fi
            echo "::warning::bash 5.3 from $url failed; trying the next mirror"
          done
          test "${ok:-}" = 1
          tar -xzf "$src/bash-5.3.tar.gz" -C "$src"
          cd "$src/bash-5.3"
          ./configure --quiet --without-bash-malloc
          make -s -j"$(nproc)"
          echo "BASH_EXPLAINER_BASH53=$src/bash-5.3/bash" >> "$GITHUB_ENV"
          # (Its manual, for test/manual.test.ts.)
          echo "BASH53_SOURCE_DIR=$src/bash-5.3" >> "$GITHUB_ENV"

      - name: Build the locale en_US.UTF-8 (`<` and `>` of `test` in test/testexpr.test.ts)
        run: |
          mkdir -p "$RUNNER_TEMP/locales"
          localedef -i en_US -f UTF-8 "$RUNNER_TEMP/locales/en_US.UTF-8"
          echo "BASH_EXPLAINER_LOCPATH=$RUNNER_TEMP/locales" >> "$GITHUB_ENV"

      - name: Run test/bash53.test.ts, test/manual.test.ts, test/testexpr.test.ts and test/posix-exits.test.ts
        env:
          # Fail instead of skipping when bash 5.3 or its manual is missing.
          BASH_EXPLAINER_BASH53_REQUIRED: '1'
        run: npx mocha --no-config --node-option import=tsx --timeout 10000 test/bash53.test.ts test/manual.test.ts test/testexpr.test.ts test/posix-exits.test.ts

      - name: Run the probe rows of bash 5.3, and every try-it in bash 5.3 (test/probe.test.ts)
        env:
          BASH_EXPLAINER_BASH53_REQUIRED: '1'
        run: npx mocha --no-config --node-option import=tsx --timeout 60000 test/probe.test.ts --grep 'bash 5\.3'
