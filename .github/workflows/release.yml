name: Release

# Push a tag such as v0.1.0 (matching "version" in package.json) to publish that version to the
# VS Code Marketplace and Open VSX, and to create a GitHub Release with the .vsix attached.
#
# Run by hand (workflow_dispatch) it is a dry run: it does everything up to packaging, and the
# publish and web page jobs are skipped. It never publishes.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to read the runs of the Test workflow
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Check that the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          # A dry run (workflow_dispatch) is on a branch, not a tag.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The README images (shown on the Marketplace) must show this version's UI.
      - name: Check that the README images are up to date
        run: node scripts/images-hash.mjs --check

      # The tests run in the Test workflow, on Node.js 18 and 24, with every tool, a browser and VS Code.
      # The released commit must have passed them there; this workflow does not run a smaller suite.
      - name: Check that the Test workflow passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait (up to 60 minutes) while a run of this commit is still going, then require a success.
          for attempt in $(seq 1 60); do
            runs=$(gh run list --workflow test.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion)
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")" -gt 0 ]; then
              echo "The Test workflow passed on $GITHUB_SHA."
              exit 0
            fi
            # No run yet: a tag pushed seconds after the merge, before the run shows up. Wait 5 minutes for it.
            if [ "$(jq 'length' <<< "$runs")" -gt 0 ] && [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" -eq 0 ]; then
              break
            fi
            if [ "$(jq 'length' <<< "$runs")" -eq 0 ] && [ "$attempt" -gt 5 ]; then
              break
            fi
            echo "Waiting for the Test workflow on $GITHUB_SHA."
            sleep 60
          done
          echo "::error::The Test workflow has not passed on $GITHUB_SHA: tag a commit whose Test run succeeded"
          exit 1

      # `npm run package` pins the README's and the changelog's links to the tag (vsce --githubBranch), and
      # leaves out the note that README.md describes the development version. The npm package's README is
      # pinned the same way when it is built (scripts/build-cli.ts --tag). The page of a release must show
      # that release's images, not the newest ones on main: check the packaged files, not the sources.
      - name: Package the extension
        run: npm run package

      - name: Check that the README of each package is pinned to the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx tsx scripts/readme-pins.ts --vsix "bash-explainer-$VERSION.vsix" --tag "v$VERSION"
          npx tsx scripts/build-cli.ts --outdir="$RUNNER_TEMP/cli" --tag="v$VERSION"
          npm pack "$RUNNER_TEMP/cli" --pack-destination "$RUNNER_TEMP" --silent
          npx tsx scripts/readme-pins.ts --tgz "$RUNNER_TEMP/bash-explainer-$VERSION.tgz" --tag "v$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: bash-explainer-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    # Never on a dry run (workflow_dispatch).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Waits for approval. The Azure IDs are variables of this environment.
    environment: release
    permissions:
      contents: write
      # The job's OIDC token is exchanged for short-lived publishing tokens: an Entra ID token for
      # the Marketplace (azure/login) and an Open VSX token (trusted publishing). No PAT to expire.
      id-token: write
    env:
      VSIX: bash-explainer-${{ needs.build.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # The Marketplace accepts the managed identity added to the publisher (see docs/publishing.md).
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The same .vsix goes to both registries; --skip-duplicate makes a re-run safe.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        # This workflow is registered as the extension's trusted publisher on open-vsx.org.
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --packagePath "$VSIX" --skip-duplicate

      # The command-line tool (cli/), as the npm package bash-explainer. Skipped until the package
      # exists on npm with this workflow as its trusted publisher and the repository variable
      # NPM_PUBLISH is true (docs/publishing.md). npm exchanges the job's OIDC token, and adds
      # provenance, by itself.
      - name: Publish the command-line tool to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          # Built into a directory of its own, with the README pinned to this release's tag.
          npx tsx scripts/build-cli.ts --outdir="$RUNNER_TEMP/cli" --tag="v${{ needs.build.outputs.version }}"
          npx tsx scripts/readme-pins.ts --file "$RUNNER_TEMP/cli/README.md" --tag "v${{ needs.build.outputs.version }}"
          if npm view "bash-explainer@${{ needs.build.outputs.version }}" version >/dev/null 2>&1; then
            echo "bash-explainer ${{ needs.build.outputs.version }} is already on npm"
          else
            npx --yes npm@11.20.0 publish "$RUNNER_TEMP/cli" --access public
          fi

      # The GitHub Marketplace listing of the action is a checkbox on the release page, with no API
      # for it; see docs/publishing.md.
      - name: Create the GitHub Release
        run: |
          version="${{ needs.build.outputs.version }}"
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          gh release create "$GITHUB_REF_NAME" "$VSIX" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # The GitHub Action is used as `sf624/bash-explainer@v0`: move that major tag to this
      # release (v1 from 1.0.0 on). It does not match `v*.*.*`, so it starts no release.
      - name: Move the major version tag
        run: |
          major="v${{ needs.build.outputs.version }}"
          major="${major%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"

  pages:
    name: Web page
    needs: publish
    # The page shows the version just published.
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write # the called workflow's jobs ask for less each; this is the most any of them gets
    uses: ./.github/workflows/pages.yml
