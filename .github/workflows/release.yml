name: Release

# Push a tag such as v0.1.0 (matching "version" in package.json) to publish that version to the
# VS Code Marketplace and Open VSX, and to create a GitHub Release with the .vsix attached.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The README images (shown on the Marketplace) must show this version's UI.
      - name: Check that the README images are up to date
        run: node scripts/images-hash.mjs --check

      - name: Install the tools the tests compare against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk jq dash busybox mksh yash ksh93u+m zsh

      - run: npm ci

      - name: Type check and unit tests
        run: npm test

      - name: Package the extension
        run: npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: bash-explainer-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    # Waits for approval. The Azure IDs are variables of this environment.
    environment: release
    permissions:
      contents: write
      # The job's OIDC token is exchanged for short-lived publishing tokens: an Entra ID token for
      # the Marketplace (azure/login) and an Open VSX token (trusted publishing). No PAT to expire.
      id-token: write
    env:
      VSIX: bash-explainer-${{ needs.build.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # The Marketplace accepts the managed identity added to the publisher (see docs/publishing.md).
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The same .vsix goes to both registries; --skip-duplicate makes a re-run safe.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        # This workflow is registered as the extension's trusted publisher on open-vsx.org.
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --packagePath "$VSIX" --skip-duplicate

      # The command-line tool (cli/), as the npm package bash-explainer. Skipped until the package
      # exists on npm with this workflow as its trusted publisher and the repository variable
      # NPM_PUBLISH is true (docs/publishing.md). npm exchanges the job's OIDC token, and adds
      # provenance, by itself.
      - name: Publish the command-line tool to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          npm run build:cli
          if npm view "bash-explainer@${{ needs.build.outputs.version }}" version >/dev/null 2>&1; then
            echo "bash-explainer ${{ needs.build.outputs.version }} is already on npm"
          else
            npx --yes npm@11.20.0 publish ./cli --access public
          fi

      # The GitHub Marketplace listing of the action is a checkbox on the release page, with no API
      # for it; see docs/publishing.md.
      - name: Create the GitHub Release
        run: |
          version="${{ needs.build.outputs.version }}"
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          gh release create "$GITHUB_REF_NAME" "$VSIX" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # The GitHub Action is used as `sf624/bash-explainer@v0`: move that major tag to this
      # release (v1 from 1.0.0 on). It does not match `v*.*.*`, so it starts no release.
      - name: Move the major version tag
        run: |
          major="v${{ needs.build.outputs.version }}"
          major="${major%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"

  pages:
    name: Web page
    needs: publish
    # The page shows the version just published.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
