name: README images

# Records the README images (images/readme/*.gif, name-hints.png) with scripts/capture-readme-images.mjs, in
# VS Code on a virtual display. Run by hand when the UI changed (the Release workflow stops until the
# images match it, see scripts/images-hash.mjs): it opens a pull request with the new images. On a
# pull request that changes the recording itself, it only uploads the images as an artifact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/capture-readme-images.mjs
      - .github/workflows/readme-images.yml

permissions:
  contents: read

jobs:
  record:
    name: Record the README images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # To start the tests on the pull request it opens (see below).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Cascadia Code is the font the recording sets; the emoji font draws emoji in the explanations.
      - name: Install a virtual display, ffmpeg and fonts
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb ffmpeg fonts-cascadia-code fonts-noto-color-emoji

      - name: Download VS Code
        id: vscode
        run: |
          for attempt in 1 2 3; do
            if path=$(node --import tsx integration/run.ts --version=stable --download-only | tail -n 1) && [ -e "$path" ]; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Could not download VS Code"
          exit 1

      - name: Record
        env:
          VSCODE_PATH: ${{ steps.vscode.outputs.path }}
          # The script's temporary directory, so a failure's logs can be uploaded.
          TMPDIR: ${{ runner.temp }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run images

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-images
          path: |
            images/readme/*.gif
            images/readme/*.png

      # When the recording fails, its temporary directory holds VS Code's log and a screenshot.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: readme-images-failure
          path: |
            ${{ runner.temp }}/bash-explainer-images-*/*.log
            ${{ runner.temp }}/bash-explainer-images-*/*.png
          if-no-files-found: ignore

      - name: Open a pull request with the new images
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VSCODE_PATH: ${{ steps.vscode.outputs.path }}
        run: |
          if git diff --quiet -- images/readme && [ -z "$(git status --porcelain -- images/readme)" ]; then
            echo "The images did not change."
            exit 0
          fi
          branch="readme-images/${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add images/readme
          git commit -m 'Re-record the README images'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Re-record the README images' \
            --body "Recorded by the [README images workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) with VS Code $(basename "$(dirname "$VSCODE_PATH")"). Check the images under *Files changed* before merging."
          # A pull request opened with the workflow's token does not start other workflows, so
          # start the required tests on its branch by hand.
          gh workflow run test.yml --ref "$branch"
