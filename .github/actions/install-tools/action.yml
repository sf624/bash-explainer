name: Install the tools the tests compare against
description: >-
  The tests compare the built-in runners with the real tools, and the shell-support table with
  real shells; tools that are missing are skipped. GPL tools are installed as separate programs.

runs:
  using: composite
  steps:
    - run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends gawk jq dash busybox mksh yash ksh93u+m zsh python3-yaml
      shell: bash
    # mikefarah/yq (MIT; a Go program, run as a separate program) for the yq examples, test/examples-outputs.test.ts:
    # a pinned release, checked by its SHA-256 on every run, found through BASH_EXPLAINER_YQ4. The binary is cached,
    # since github.com release downloads fail now and then (504, connection died) and then fail the shard.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/yq-mikefarah
        key: yq-mikefarah-${{ runner.os }}-v4.54.1-8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    - env:
        YQ_VERSION: v4.54.1
        YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
      run: |
        dir="$RUNNER_TEMP/yq-mikefarah"
        mkdir -p "$dir"
        if [ ! -x "$dir/yq" ]; then
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$dir/yq" "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64"
        fi
        echo "$YQ_SHA256  $dir/yq" | sha256sum --check
        chmod +x "$dir/yq"
        echo "BASH_EXPLAINER_YQ4=$dir/yq" >> "$GITHUB_ENV"
      shell: bash
    # buildifier (Apache-2.0; a static Go program, run as a separate program) from bazel-contrib/buildtools for
    # test/buildifier.test.ts: a pinned release, checked by its SHA-256 on every run (the release lists none: this is
    # the digest GitHub shows for the asset, and `sha256sum` of the file downloaded), found through BUILDIFIER, cached.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/buildifier
        key: buildifier-${{ runner.os }}-v10.2.0-470844069d710d0b7740e55007071c63e4d00be89a833dce5d1a91790e84dc28
    - env:
        BUILDIFIER_VERSION: v10.2.0
        BUILDIFIER_SHA256: 470844069d710d0b7740e55007071c63e4d00be89a833dce5d1a91790e84dc28
      run: |
        dir="$RUNNER_TEMP/buildifier"
        mkdir -p "$dir"
        if [ ! -x "$dir/buildifier" ]; then
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$dir/buildifier" "https://github.com/bazel-contrib/buildtools/releases/download/$BUILDIFIER_VERSION/buildifier-linux-amd64"
        fi
        echo "$BUILDIFIER_SHA256  $dir/buildifier" | sha256sum --check
        chmod +x "$dir/buildifier"
        echo "BUILDIFIER=$dir/buildifier" >> "$GITHUB_ENV"
      shell: bash
